org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Der Build-Cache bleibt aus. Holt Gradle fertig übersetzte Klassen aus dem Cache und ändert sich danach eine
# öffentliche Schnittstelle, übersetzt Kotlin 2.4.21 nur einen Teil der Tests neu und lässt den Rest stillschweigend
# weg: Der Lauf meldet Erfolg, obwohl kaum ein Test gelaufen ist (am 15.11.2026 nachgestellt: 39 statt 508 Tests in
# :domain). Ohne Cache tritt das nicht auf.
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
