# Prüft und baut die Android-App bei jedem Push und stellt die Testversion bereit (Vorbild: Drink With Me).
#
# - Tests von Rechenkern (domain), Datenschicht (data) und App (inkl. Bildschirmfotos), Testabdeckung des Kerns
# - Testversion als Release-APK der Ausgabe „fdroid“, signiert mit dem öffentlichen Test-Schlüssel app/debug.keystore,
#   versionCode 1000 + Laufnummer (siehe app/build.gradle.kts)
# - Installationstest im Emulator mit dem neuesten Android
# - Öffentliche Testversion zum Herunterladen ohne Anmeldung (Release „testversion“):
#     https://github.com/q0ochen/SchafkopfTracker/releases/download/testversion/SchafkopfTracker.apk
# - Eigene F-Droid-Paketquelle auf dem Zweig „fdroid-repo“ (braucht das Secret FDROID_REPO_KEYSTORE, docs/F-DROID.md)
#
# Veröffentlicht wird nur nach einem Push auf main, entwicklung oder einen Arbeitszweig claude/… (oder „Run workflow“
# auf einem dieser Zweige), nie für Pull Requests. Es gewinnt immer der neueste Lauf: Ein älterer Lauf überschreibt nie
# eine neuere Testversion.
name: Android

on:
  push:
    paths:
      - "app/**"
      - "domain/**"
      - "data/**"
      - "database/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "fastlane/**"
      - "fdroid/**"
      - "web/src/core/golden/**"
      - "web/src/data/golden/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "domain/**"
      - "data/**"
      - "database/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "fastlane/**"
      - "fdroid/**"
      - "web/src/core/golden/**"
      - "web/src/data/golden/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testen und Testversion bauen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android-SDK ergänzen (Plattform 37, Build-Tools 36)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null

      - name: Tests von Rechenkern, Datenschicht und Datenbank (mit Abdeckung des Kerns)
        run: ./gradlew :domain:test :data:test :domain:koverVerify :database:testDebugUnitTest --no-daemon

      - name: Tests der App (inklusive Bildschirmfotos)
        run: ./gradlew :app:testFdroidDebugUnitTest --no-daemon

      # Schutz vor stillschweigend ausgelassenen Tests: „BUILD SUCCESSFUL“ allein reicht nicht (siehe CLAUDE.md).
      # Die Untergrenzen nur anheben, nie senken, ohne den Grund zu kennen.
      - name: Zahl der Tests prüfen
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          minimum = {"domain": 679, "data": 277, "database": 24, "app": 177}
          ok = True
          for module, least in minimum.items():
              files = glob.glob(f"{module}/build/test-results/**/*.xml", recursive=True)
              tests = sum(int(ET.parse(f).getroot().get("tests")) for f in files)
              failed = sum(int(ET.parse(f).getroot().get(k)) for f in files for k in ("failures", "errors"))
              print(f"{module}: {tests} Tests, {failed} fehlgeschlagen (mindestens {least} erwartet)")
              if tests < least or failed:
                  ok = False
          sys.exit(0 if ok else "::error::Es sind weniger Tests gelaufen als erwartet oder Tests sind fehlgeschlagen.")
          PY

      # Laufnummer → steigende versionCode (1000 + Nummer) und versionName „0.1.0-test.<Nummer>“, damit Android,
      # F-Droid und Obtainium jede Testversion als Update erkennen (siehe app/build.gradle.kts).
      # Gemeinsame Runde: Adresse und Publishable Key des Supabase-Projekts kommen aus app/supabase.properties oder,
      # solange die Datei leer ist, aus den GitHub-Variablen (beides öffentlich, kein Geheimnis). Ohne Werte ist die
      # Funktion in der Testversion abgeschaltet.
      - name: Testversion bauen (Release, Ausgabe fdroid)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          ./gradlew :app:assembleFdroidRelease --no-daemon -PciBuildNumber=${{ github.run_number }}
          "-PsupabaseUrl=$SUPABASE_URL" "-PsupabasePublishableKey=$SUPABASE_PUBLISHABLE_KEY"

      # Nur mit dem festen Schlüssel aus app/debug.keystore lassen sich neue Testversionen ohne Datenverlust über alte
      # installieren. Außerdem muss die Versionsnummer stimmen.
      - name: Signatur und Versionsnummer prüfen
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK="app/build/outputs/apk/fdroid/release/app-fdroid-release.apk"
          EXPECTED="$(keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          ACTUAL="$("${BT}apksigner" verify --print-certs "$APK" | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          echo "Signatur erwartet:    $EXPECTED"
          echo "Signatur tatsächlich: $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          BADGING="$("${BT}aapt2" dump badging "$APK")"
          echo "$BADGING" | head -1
          echo "$BADGING" | grep -q "versionCode='$((1000 + GITHUB_RUN_NUMBER))'"
          if echo "$BADGING" | grep -q "application-debuggable"; then echo "::error::Die Testversion ist debuggable"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: SchafkopfTracker-android-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bildschirmfotos
          path: app/build/outputs/roborazzi/
          retention-days: 14
          if-no-files-found: ignore

  # Installationstest: Die Testversion wird im Emulator mit dem neuesten verfügbaren Android installiert und gestartet –
  # einmal normal, einmal mit 16-KB-Speicherseiten (wie auf neuen Pixel-Handys). So ist belegt, dass die APK auf
  # aktuellen Geräten installierbar ist und startet; Sperren durch Geräte-Einstellungen prüft das nicht.
  installtest:
    name: Installationstest (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: neuestes Android
            variant: google_apis
          - name: neuestes Android, 16-KB-Speicherseiten
            variant: google_apis_ps16k
    env:
      VARIANT: ${{ matrix.variant }}
      # avdmanager und emulator sollen sicher denselben AVD-Ordner verwenden.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: SchafkopfTracker-android-apk
          path: apk

      - name: Neuestes System-Image installieren
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          IMG="$("$SDKM" --list 2>/dev/null \
            | grep -oE "system-images;android-[0-9]+(\.[0-9]+)?;${VARIANT};x86_64" \
            | sort -u -t';' -k2,2V | tail -1)"
          if [ -z "$IMG" ]; then echo "::error::Kein System-Image für ${VARIANT} (x86_64) gefunden"; exit 1; fi
          echo "System-Image: $IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "$IMG" emulator platform-tools >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n test -k "$IMG" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Emulator starten
        run: |
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          EMU_PID=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" start-server
          BOOTED=""
          for _ in $(seq 1 180); do   # höchstens 15 Minuten
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "::error::Der Emulator hat sich beendet"; tail -60 emulator.log; exit 1
            fi
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then BOOTED=1; break; fi
            sleep 5
          done
          if [ -z "$BOOTED" ]; then echo "::error::Der Emulator ist nicht hochgefahren"; tail -60 emulator.log; exit 1; fi
          echo "Android $("$ADB" shell getprop ro.build.version.release | tr -d '\r')" \
            "(API $("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')," \
            "Speicherseite $("$ADB" shell getconf PAGESIZE | tr -d '\r') Byte)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: APK installieren und starten
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" install apk/app-fdroid-release.apk
          "$ADB" logcat -c
          "$ADB" shell am start -W -n io.github.q0ochen.schafkopf/.app.MainActivity
          sleep 20
          "$ADB" exec-out screencap -p > screenshot.png
          "$ADB" logcat -d > logcat.txt
          if grep -A3 "FATAL EXCEPTION" logcat.txt | grep -q "io.github.q0ochen.schafkopf"; then
            grep -A30 "FATAL EXCEPTION" logcat.txt; echo "::error::Die App ist beim Start abgestürzt"; exit 1
          fi
          PID="$("$ADB" shell pidof io.github.q0ochen.schafkopf | tr -d '\r')"
          if [ -z "$PID" ]; then echo "::error::Die App läuft nach dem Start nicht"; exit 1; fi
          echo "Installiert und gestartet: $IMG" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installtest-${{ matrix.variant }}
          path: |
            screenshot.png
            logcat.txt
            emulator.log
          if-no-files-found: ignore

  # Öffentliche Testversion: Nach erfolgreichem Build und Installationstest wird die APK als Release „testversion“
  # veröffentlicht – ohne GitHub-Anmeldung und ohne ZIP herunterladbar, mit festem Link. Es gibt immer nur EINE
  # Testversion; sie wird bei jedem Build ersetzt, aber nie durch einen älteren Lauf.
  testversion:
    name: Öffentliche Testversion aktualisieren
    needs: [build, installtest]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/entwicklung' ||
       startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-testversion
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: testversion
    steps:
      # Ein langsamer älterer Lauf darf eine neuere Testversion nicht überschreiben. Die Concurrency-Gruppe sorgt
      # dafür, dass Prüfen und Veröffentlichen nicht zwischen zwei Läufen verzahnt werden.
      - name: Ist schon eine neuere Testversion veröffentlicht?
        id: newer
        run: |
          PUB="$(gh release view "$TAG" --json body --jq .body 2>/dev/null | grep -oP '\-test\.\K[0-9]+' | head -1 || true)"
          echo "Veröffentlicht: ${PUB:-keine}, dieser Lauf: ${GITHUB_RUN_NUMBER}"
          if [ -n "$PUB" ] && [ "$PUB" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "::warning::Veröffentlicht ist schon Testversion ${PUB} (neuer als ${GITHUB_RUN_NUMBER}) – übersprungen. Wurde android.yml umbenannt, beginnt die Laufnummer neu: dann in app/build.gradle.kts den Versatz 1000 erhöhen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.newer.outputs.skip != 'true'
        with:
          name: SchafkopfTracker-android-apk
          path: apk

      - name: APK benennen und Prüfsumme bilden
        if: steps.newer.outputs.skip != 'true'
        run: |
          cp apk/app-fdroid-release.apk SchafkopfTracker.apk
          sha256sum SchafkopfTracker.apk | tee SchafkopfTracker.apk.sha256

      - name: Beschreibung der Testversion
        if: steps.newer.outputs.skip != 'true'
        env:
          # Ein-Tipp-Import für Obtainium: Vorabversionen einbeziehen und das Datum des letzten APK-Uploads als Version
          # verwenden – nötig, weil der Tag der Testversion gleich bleibt (Format wie bei Drink With Me geprüft).
          OBTAINIUM_LINK: "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22io.github.q0ochen.schafkopf%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fq0ochen%2FSchafkopfTracker%22%2C%22author%22%3A%22q0ochen%22%2C%22name%22%3A%22Schafkopf%20Tracker%22%2C%22preferredApkIndex%22%3A0%2C%22additionalSettings%22%3A%22%7B%5C%22includePrereleases%5C%22%3Atrue%2C%5C%22versionDetection%5C%22%3Afalse%2C%5C%22releaseDateAsVersion%5C%22%3Atrue%2C%5C%22useLatestAssetDateAsReleaseDate%5C%22%3Atrue%7D%22%2C%22overrideSource%22%3Anull%7D"
        run: |
          STAND="$(date -u '+%d.%m.%Y, %H:%M UTC')"
          KURZ="${GITHUB_SHA::7}"
          cat > notes.md <<EOF
          **Testversion des Schafkopf Trackers für Android** – Version \`0.1.0-test.${GITHUB_RUN_NUMBER}\`, Stand ${STAND}, Code-Stand \`${KURZ}\`.

          **Am bequemsten über F-Droid:** Anleitung mit Link und QR-Code in der [README](https://github.com/${GH_REPO}#android-testversion). Dann kommen neue Testversionen als normale Updates.

          **Oder direkt herunterladen (ohne Anmeldung):** https://github.com/${GH_REPO}/releases/download/${TAG}/SchafkopfTracker.apk

          ### Installieren (direkter Download)
          1. Den Link oben **in Chrome** auf dem Android-Handy öffnen. Fragt Chrome nach: **Trotzdem herunterladen**, dann **Öffnen**.
          2. Die Erlaubnis für diese Quelle **zulassen** (Pixel: „Dieser Quelle vertrauen“ bzw. „Nur dieses Mal“ / „Immer zulassen“), dann **Installieren**.
          3. Meldet sich Play Protect: **nicht** auf „OK“, sondern **Weitere Details → Trotzdem installieren** (oder **App scannen**).

          Klappt es nicht: bitte den genauen Fehlertext oder einen Screenshot schicken.

          ### Automatisch aktuell bleiben ohne F-Droid (optional)
          Die freie App [Obtainium](https://github.com/ImranR98/Obtainium/releases) installieren, dann auf dem Android-Gerät diesen Link öffnen und den Import bestätigen:
          [Schafkopf Tracker in Obtainium hinzufügen](${OBTAINIUM_LINK}).

          ### Hinweise
          - Testversion, mit dem öffentlichen Test-Schlüssel signiert. Neue Testversionen lassen sich einfach drüber installieren; die eingetragenen Abende bleiben erhalten.
          - Alles bleibt auf dem Handy. Internet braucht die App nur für zwei freiwillige Zusätze: den Abend-Kommentator (sendet erst nach Zustimmung) und die Sicherung in Google Drive.
          - Prüfsumme (SHA-256) der APK: siehe \`SchafkopfTracker.apk.sha256\`.
          EOF

      - name: Testversion veröffentlichen oder ersetzen
        if: steps.newer.outputs.skip != 'true'
        run: |
          TITEL="Testversion (Android)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Tag auf den aktuellen Stand verschieben, Text erneuern.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" --title "$TITEL" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITEL" --notes-file notes.md --prerelease
          fi
          gh release upload "$TAG" SchafkopfTracker.apk SchafkopfTracker.apk.sha256 --clobber
          echo "Öffentlicher Link: https://github.com/$GH_REPO/releases/download/$TAG/SchafkopfTracker.apk" | tee -a "$GITHUB_STEP_SUMMARY"

  # Eigene F-Droid-Paketquelle (nicht das offizielle F-Droid): signierter Index + die aktuelle und die vorige
  # Testversion auf dem Zweig „fdroid-repo“, abrufbar über raw.githubusercontent.com. Tester fügen sie einmal in der
  # F-Droid-App hinzu und bekommen Updates über F-Droid. Braucht das Secret FDROID_REPO_KEYSTORE (docs/F-DROID.md);
  # fehlt es, wird der Job übersprungen. Der geheime Schlüssel ist nur im Schritt „Paketquelle bauen“ sichtbar, das
  # Schreib-Token nur beim Veröffentlichen; fdroidserver wird mit festen Prüfsummen installiert.
  fdroid:
    name: Eigene F-Droid-Paketquelle aktualisieren
    needs: [build, installtest]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/entwicklung' ||
       startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-fdroid
      cancel-in-progress: false
    env:
      # SHA-256 des Zertifikats der Paketquelle – derselbe Wert steht im Link in README.md, im QR-Code und in
      # docs/F-DROID.md (build-repo.sh prüft das).
      FDROID_REPO_FINGERPRINT: 6e2eca0b6f43f41f7c4d31c3a106e2fb44b71e3df72a34b48f070b0ae0d36590
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Schlüssel vorhanden?
        id: key
        env:
          HAS_KEY: ${{ secrets.FDROID_REPO_KEYSTORE != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Das Secret FDROID_REPO_KEYSTORE fehlt – die F-Droid-Paketquelle wird nicht aktualisiert (docs/F-DROID.md, „Einrichten“)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Bisherige Paketquelle holen (öffentlich, ohne Token): für die vorige APK und die bisherige Laufnummer.
      - name: Bisherige Paketquelle holen
        id: previous
        if: steps.key.outputs.ready == 'true'
        run: |
          PREV="$RUNNER_TEMP/fdroid-previous"
          rm -rf "$PREV" && git init -q "$PREV"
          PUB=""
          if git -C "$PREV" fetch -q --depth=1 "https://github.com/${GH_REPO}.git" fdroid-repo 2>/dev/null; then
            git -C "$PREV" checkout -q FETCH_HEAD
            PUB="$(git -C "$PREV" log -1 --format=%s | grep -oP '\-test\.\K[0-9]+' | head -1 || true)"
          fi
          echo "Veröffentlicht: ${PUB:-keine}, dieser Lauf: ${GITHUB_RUN_NUMBER}"
          if [ -n "$PUB" ] && [ "$PUB" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "::warning::In der F-Droid-Paketquelle liegt schon Testversion ${PUB} (neuer als ${GITHUB_RUN_NUMBER}) – übersprungen. Wurde android.yml umbenannt, beginnt die Laufnummer neu: dann in app/build.gradle.kts den Versatz 1000 erhöhen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "dir=$PREV/fdroid/repo" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true' && steps.previous.outputs.skip != 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ready == 'true' && steps.previous.outputs.skip != 'true'
        with:
          name: SchafkopfTracker-android-apk
          path: apk

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ready == 'true' && steps.previous.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: fdroidserver installieren (feste Prüfsummen)
        if: steps.key.outputs.ready == 'true' && steps.previous.outputs.skip != 'true'
        run: |
          python -m pip install --quiet --require-hashes -r fdroid/requirements.txt
          # apksigner (für die Signatur des Index) aus den neuesten Android-Build-Tools.
          ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Paketquelle bauen
        if: steps.key.outputs.ready == 'true' && steps.previous.outputs.skip != 'true'
        env:
          FDROID_REPO_KEYSTORE: ${{ secrets.FDROID_REPO_KEYSTORE }}
        run: >-
          fdroid/build-repo.sh apk/app-fdroid-release.apk "$((1000 + GITHUB_RUN_NUMBER))" "$RUNNER_TEMP/fdroidwork"
          "${{ steps.previous.outputs.dir }}"

      - name: Auf dem Zweig „fdroid-repo“ veröffentlichen
        if: steps.key.outputs.ready == 'true' && steps.previous.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUB="$RUNNER_TEMP/fdroid-publish"
          rm -rf "$PUB" && mkdir -p "$PUB/fdroid"
          cp -R "$RUNNER_TEMP/fdroidwork/repo" "$PUB/fdroid/repo"
          LINK="https://fdroid.link/#https://raw.githubusercontent.com/${GH_REPO}/fdroid-repo/fdroid/repo?fingerprint=${FDROID_REPO_FINGERPRINT^^}"
          cat > "$PUB/README.md" <<EOF
          # F-Droid-Paketquelle für die Testversionen des Schafkopf Trackers

          Dieser Zweig wird automatisch von \`.github/workflows/android.yml\` erzeugt und bei jedem Build ersetzt –
          bitte nicht von Hand ändern. Er enthält die aktuelle Testversion (0.1.0-test.${GITHUB_RUN_NUMBER}) und die
          vorige.

          In der F-Droid-App hinzufügen: ${LINK}

          Fingerabdruck: \`${FDROID_REPO_FINGERPRINT}\`
          EOF
          cd "$PUB"
          git init -q -b fdroid-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "F-Droid-Paketquelle: Testversion 0.1.0-test.${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          # Nur ein einziger Commit: Alte APKs sollen den Zweig nicht wachsen lassen.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" \
            push --force "https://github.com/${GH_REPO}.git" HEAD:refs/heads/fdroid-repo
          echo "Veröffentlicht: ${LINK}" | tee -a "$GITHUB_STEP_SUMMARY"
