# Prüft und baut die Web-App (Zwischenlösung fürs iPhone) bei jeder Änderung; auf main wird sie zusätzlich auf
# GitHub Pages veröffentlicht: https://q0ochen.github.io/SchafkopfTracker/
# Erneut veröffentlichen: Actions → „Web-App“ → „Run workflow“ mit Branch main.
# Einmalig in den Repository-Einstellungen: Settings → Pages → Build and deployment → Source „GitHub Actions“.
name: Web-App

on:
  push:
    paths:
      - "web/**"
      - "app/src/main/res/drawable/**"
      - "app/src/main/res/values/colors.xml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "app/src/main/res/drawable/**"
      - "app/src/main/res/values/colors.xml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prüfen, testen und bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Abhängigkeiten (exakt nach package-lock.json)
        run: npm ci

      # Chromium zeichnet die App-Symbole (aus den Vektorgrafiken der Android-App) und führt die Oberflächen-Tests aus.
      - name: Chromium für Playwright
        run: npx playwright install --with-deps chromium

      - name: Typprüfung
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests (Rechenkern und Dateiformat inkl. Golden-Tests gegen den Kotlin-Code, Speicher, Oberflächenlogik)
        run: npm test

      - name: Build
        run: npm run build

      - name: Oberflächen-Tests (Playwright gegen vite preview, iPhone-Größe und Desktop)
        run: npm run test:e2e

      # Zusätzlich mit der Safari-Engine, so nah am iPhone wie ohne Gerät möglich.
      - name: WebKit für Playwright
        run: npx playwright install --with-deps webkit

      - name: Oberflächen-Tests mit WebKit (Safari-Engine, iPhone-Größe)
        env:
          E2E_WEBKIT: "1"
        run: npx playwright test --project iphone-webkit

      - name: Playwright-Bericht (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Gebaute Web-App
        uses: actions/upload-artifact@v4
        with:
          name: SchafkopfTracker-web
          path: web/dist
          retention-days: 14

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: build
    # Push auf main oder manueller Start („Run workflow“) auf main – nie für Pull Requests oder andere Zweige.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SchafkopfTracker-web
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
