# Eigene F-Droid-Paketquelle für die Testversionen des Schafkopf Trackers (nicht das offizielle F-Droid).
# Wird von .github/workflows/android.yml mit fdroid/build-repo.sh gebaut und auf dem Zweig „fdroid-repo“
# veröffentlicht. Erklärung: docs/F-DROID.md.
repo_url: https://raw.githubusercontent.com/q0ochen/SchafkopfTracker/fdroid-repo/fdroid/repo
repo_name: Schafkopf Tracker – Testversionen
repo_description: >-
  Testversionen des Schafkopf Trackers, automatisch aus dem öffentlichen Quellcode auf GitHub gebaut.
  Das ist nicht das offizielle F-Droid-Verzeichnis.
archive_older: 2
repo_keyalias: schafkopf-fdroid
keystore: keystore.p12
# Das Passwort ist absichtlich nicht geheim: Geheim ist die Schlüsseldatei selbst (GitHub-Secret FDROID_REPO_KEYSTORE).
keystorepass:
  env: FDROID_KEYSTORE_PASS
keypass:
  env: FDROID_KEYSTORE_PASS
